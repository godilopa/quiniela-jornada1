<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quiniela</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:20px;background:#f7fafc}
    .card{background:#fff;padding:16px;border-radius:8px;box-shadow:0 6px 18px rgba(10,10,10,0.06);margin-bottom:16px}
    h1{margin-top:0}
    table{width:100%;border-collapse:collapse}
    th,td{border:1px solid #e6e6e6;padding:8px;text-align:center}
    select,input{padding:6px;border-radius:6px;border:1px solid #ddd}
    .small{font-size:13px;color:#555}
    .error{color:#b00020}
    .success{color:green}
    button{padding:10px 14px;border-radius:8px;border:0;background:#0ea5a4;color:#fff;cursor:pointer}
  </style>
</head>
<body>
  <div class="card">
    <h1>Quiniela</h1>
    <label>Tipo de quiniela:
      <select id="tipoQuiniela">
        <option value="10t">10 triples</option>
      </select>
    </label>

    <div style="overflow:auto;margin-top:12px">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Partido</th>
            <th>Tipo</th>
            <th>1</th>
            <th>X</th>
            <th>2</th>
            <th>Base</th>
          </tr>
        </thead>
        <tbody id="matchesBody"></tbody>
      </table>
    </div>

    <div class="card" style="margin-top:12px">
      <h3>Pleno al 15 — R.MADRID vs ATH.CLUB (elige goles para cada equipo)</h3>
      <div style="display:flex;gap:12px;align-items:center">
        <div>
          <div class="small">Local (R.MADRID)</div>
          <select id="plenoLocal">
            <option value="">--</option>
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="M">M</option>
          </select>
        </div>
        <div>
          <div class="small">Visitante (ATH.CLUB)</div>
          <select id="plenoVisitante">
            <option value="">--</option>
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="M">M</option>
          </select>
        </div>
      </div>
    </div>

    <div style="margin-top:12px;display:flex;gap:12px;align-items:center">
      <button id="sendBtn">Enviar a Google Sheets</button>
      <div id="status" class="small"></div>
    </div>
  </div>

<script>
const matches = [
  {id:1,  home:'ALAVÉS',      away:'RAYO'},
  {id:2,  home:'BETIS',       away:'LEVANTE'},
  {id:3,  home:'CELTA',       away:'SEVILLA'},
  {id:4,  home:'ESPANYOL',    away:'R.SOCIEDAD'},
  {id:5,  home:'GETAFE',      away:'OSASUNA'},
  {id:6,  home:'MALLORCA',    away:'R.OVIEDO'},
  {id:7,  home:'VILLARREAL',  away:'AT.MADRID'},
  {id:8,  home:'VALENCIA',    away:'BARCELONA'},
  {id:9,  home:'GIRONA',      away:'ELCHE'},
  {id:10, home:'MÁLAGA',      away:'RACING S.'},
  {id:11, home:'ANDORRA FC',  away:'CEUTA'},
  {id:12, home:'HUESCA',      away:'CASTELLÓN'},
  {id:13, home:'EIBAR',       away:'CÓRDOBA'},
  {id:14, home:'SPORTING',    away:'ALMERÍA'},
  {id:15, home:'R.MADRID',    away:'ATH.CLUB'}
];

const mapping = {
  '10t': { triples: 10 }
};

const matchesBody = document.getElementById('matchesBody');

// Guarda el primer resultado marcado por fila (para base automática)
const firstBaseMap = {};

function buildTable() {
  matchesBody.innerHTML = '';
  matches.slice(0, 14).forEach(m => {
    const tr = document.createElement('tr');
    tr.dataset.id = m.id;
    tr.innerHTML = `
      <td>${m.id}</td>
      <td style="text-align:left">${m.home} - ${m.away}</td>
      <td>
        <select class="tipo">
          <option value="S">Simple</option>
          <option value="D">Doble</option>
          <option value="T">Triple</option>
        </select>
      </td>
      <td><input type="checkbox" class="opt" value="1"></td>
      <td><input type="checkbox" class="opt" value="X"></td>
      <td><input type="checkbox" class="opt" value="2"></td>
      <td>
        <select class="base" disabled>
          <option value="">--</option>
        </select>
      </td>
    `;
    matchesBody.appendChild(tr);

    const checkboxes = Array.from(tr.querySelectorAll('input.opt'));
    const tipoSel   = tr.querySelector('select.tipo');
    const rowId     = m.id;

    // Cuando se cambia el tipo desde el desplegable
    tipoSel.addEventListener('change', () => {
      const tipo = tipoSel.value;

      if (tipo === 'T') {
        // Marcar los 3 automáticamente
        checkboxes.forEach(cb => { cb.checked = true; });
        // Si no había base registrada, el "1" será la primera
        if (!firstBaseMap[rowId]) firstBaseMap[rowId] = '1';
      } else if (tipo === 'D') {
        // Dejar solo los 2 primeros marcados (si había 3)
        let kept = 0;
        checkboxes.forEach(cb => {
          if (cb.checked) { if (kept < 2) kept++; else cb.checked = false; }
        });
        // Si no queda ninguno marcado tras el ajuste, limpiar firstBase
        const remaining = checkboxes.filter(b => b.checked);
        if (remaining.length === 0) firstBaseMap[rowId] = null;
        else if (!firstBaseMap[rowId]) firstBaseMap[rowId] = remaining[0].value;
      } else if (tipo === 'S') {
        // Dejar solo 1 marcado
        let kept = 0;
        checkboxes.forEach(cb => {
          if (cb.checked) { if (kept === 0) kept++; else cb.checked = false; }
        });
        const remaining = checkboxes.filter(b => b.checked);
        if (remaining.length === 0) firstBaseMap[rowId] = null;
        else firstBaseMap[rowId] = remaining[0].value;
      }

      updateBase(tr, rowId);
    });

    // Cuando se marca/desmarca un checkbox manualmente
    checkboxes.forEach(cb => {
      cb.addEventListener('change', () => {
        const checkedBoxes = checkboxes.filter(b => b.checked);
        const count = checkedBoxes.length;

        if (cb.checked) {
          // Si es el primero en marcarse, registrar como base inicial
          if (count === 1) firstBaseMap[rowId] = cb.value;
        } else {
          // Si se desmarca el que era la base inicial, reasignar
          if (firstBaseMap[rowId] === cb.value) {
            const remaining = checkboxes.filter(b => b.checked);
            firstBaseMap[rowId] = remaining.length > 0 ? remaining[0].value : null;
          }
        }

        // Actualizar tipo según cantidad marcada
        if      (count >= 3) tipoSel.value = 'T';
        else if (count === 2) tipoSel.value = 'D';
        else                  tipoSel.value = 'S';

        enforceLimits(tr);
        updateBase(tr, rowId);
      });
    });
  });
}

function enforceLimits(tr) {
  const tipo  = tr.querySelector('select.tipo').value;
  const boxes = Array.from(tr.querySelectorAll('input.opt'));
  const checked = boxes.filter(b => b.checked);
  if (tipo === 'S' && checked.length > 1) {
    let kept = 0;
    boxes.forEach(b => { if (b.checked) { if (kept === 0) kept = 1; else b.checked = false; } });
  } else if (tipo === 'D' && checked.length > 2) {
    let kept = 0;
    boxes.forEach(b => { if (b.checked) { if (kept < 2) kept++; else b.checked = false; } });
  }
}

function updateBase(tr, rowId) {
  const boxes   = Array.from(tr.querySelectorAll('input.opt'));
  const checked = boxes.filter(b => b.checked).map(b => b.value);
  const baseSel = tr.querySelector('select.base');
  const prevBase = baseSel.value;

  baseSel.innerHTML = '';
  if (checked.length === 0) {
    baseSel.disabled = true;
    const o = document.createElement('option'); o.value = ''; o.textContent = '--';
    baseSel.appendChild(o);
    firstBaseMap[rowId] = null;
    return;
  }

  const empty = document.createElement('option'); empty.value = ''; empty.textContent = '--';
  baseSel.appendChild(empty);
  checked.forEach(v => {
    const o = document.createElement('option'); o.value = v; o.textContent = v;
    baseSel.appendChild(o);
  });
  baseSel.disabled = false;

  // Prioridad: 1) firstBase si sigue siendo válida  2) base anterior  3) vacío
  const first = firstBaseMap[rowId];
  if (first && checked.includes(first)) {
    baseSel.value = first;
  } else if (prevBase && checked.includes(prevBase)) {
    baseSel.value = prevBase;
  } else {
    baseSel.value = '';
  }
}

buildTable();

// === Validación y envío ===
document.getElementById('sendBtn').addEventListener('click', async () => {
  const tipoQuiniela = document.getElementById('tipoQuiniela').value;
  const expected     = mapping[tipoQuiniela];
  const rows         = Array.from(document.querySelectorAll('#matchesBody tr'));
  let triples = 0, doubles = 0;
  const entries = [];
  const errors  = [];

  rows.forEach(tr => {
    const id        = tr.dataset.id;
    const matchText = tr.querySelector('td:nth-child(2)').textContent;
    const tipo      = tr.querySelector('select.tipo').value;
    const selections = Array.from(tr.querySelectorAll('input.opt:checked')).map(cb => cb.value);
    const base      = tr.querySelector('select.base').value;

    if (tipo === 'T') triples++;
    if (tipo === 'D') doubles++;

    if (selections.length === 0) errors.push(`Partido ${id} (${matchText}): selecciona al menos una opción.`);
    if (tipo === 'S' && selections.length !== 1) errors.push(`Partido ${id}: SIMPLE debe tener 1 selección.`);
    if (tipo === 'D' && selections.length !== 2) errors.push(`Partido ${id}: DOBLE debe tener 2 selecciones.`);
    if (tipo === 'T' && selections.length !== 3) errors.push(`Partido ${id}: TRIPLE debe tener 3 selecciones.`);
    if (!base) errors.push(`Partido ${id}: la columna Base debe estar establecida.`);
    if (base && !selections.includes(base)) errors.push(`Partido ${id}: la Base (${base}) no coincide con las selecciones.`);

    entries.push({ id, match: matchText, tipo, selections, base });
  });

  if (!expected) {
    errors.push('Tipo de quiniela no reconocido.');
  } else {
    if (triples !== expected.triples)
      errors.push(`Se esperaban ${expected.triples} triples pero hay ${triples}.`);
  }

  const plenoLocal     = document.getElementById('plenoLocal').value;
  const plenoVisitante = document.getElementById('plenoVisitante').value;
  if (!plenoLocal)     errors.push('Pleno al 15: elige los goles del equipo local (R.MADRID).');
  if (!plenoVisitante) errors.push('Pleno al 15: elige los goles del equipo visitante (ATH.CLUB).');

  const status = document.getElementById('status');
  if (errors.length) { status.innerHTML = `<span class="error">${errors.join('<br>')}</span>`; return; }

  status.textContent = 'Enviando...';

  fetch('https://script.google.com/macros/s/AKfycbzTxXmiAfGi5dEKW4nWjn2ruVkC6ynAm0fI5ovHFXbajXqdtmyXqEkdx8Tb-CQhUJFb/exec', {
    method: 'POST',
    mode: 'cors',
    body: JSON.stringify({ tipoQuiniela, partidos: entries, pleno15: { local: plenoLocal, visitante: plenoVisitante } })
  })
  .then(r => { if (!r.ok) throw new Error('Error HTTP: ' + r.status); return r.json(); })
  .then(() => { status.textContent = 'Enviado ✓'; })
  .catch(err => { status.textContent = 'Error: ' + err.message; });
});
</script>
</body>
</html>
